name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-raffi.*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential curl nasm perl pkg-config xz-utils
      - name: Build
        run: ./scripts/build-unix.sh linux-x64
      - name: Test codecs and streaming output
        run: ./scripts/test-binary.sh dist/linux-x64/ffmpeg
      - name: Check runtime dependencies
        run: |
          ! ldd dist/linux-x64/ffmpeg | grep -E 'libssl|libcrypto'
          ldd dist/linux-x64/ffmpeg
      - name: Package
        run: tar -C dist/linux-x64 -czf raffi-ffmpeg-linux-x64.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: raffi-ffmpeg-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            curl
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            unzip
            xz
            zip
      - name: Build
        run: ./scripts/build-windows.sh
      - name: Test codecs and streaming output
        run: ./scripts/test-binary.sh dist/windows-x64/ffmpeg.exe
      - name: Package
        run: cd dist/windows-x64 && zip -9 -r ../../raffi-ffmpeg-windows-x64.zip .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: raffi-ffmpeg-windows-x64.zip
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: brew install nasm
      - name: Build
        run: ./scripts/build-unix.sh "${{ matrix.target }}"
      - name: Test codecs and streaming output
        run: ./scripts/test-binary.sh "dist/${{ matrix.target }}/ffmpeg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  package-macos:
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: artifacts
      - name: Create universal executable
        run: |
          mkdir -p dist/macos-universal
          lipo -create \
            artifacts/macos-x64/ffmpeg \
            artifacts/macos-arm64/ffmpeg \
            -output dist/macos-universal/ffmpeg
          lipo dist/macos-universal/ffmpeg -verify_arch x86_64 arm64
          chmod 0755 dist/macos-universal/ffmpeg
          cp artifacts/macos-arm64/LICENSE.FFMPEG dist/macos-universal/
          cp artifacts/macos-arm64/BUILD-INFO.txt dist/macos-universal/BUILD-INFO.arm64.txt
          cp artifacts/macos-x64/BUILD-INFO.txt dist/macos-universal/BUILD-INFO.x64.txt
          tar -C dist/macos-universal -czf raffi-ffmpeg-macos-universal.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: raffi-ffmpeg-macos-universal.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - package-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        run: |
          source versions.env
          expected="v${FFMPEG_VERSION}-raffi.${BUILD_REVISION}"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-universal
          path: release
      - name: Create checksums
        run: |
          source scripts/common.sh
          download_verified \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "release/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "${FFMPEG_SOURCE_SHA256}"
          download_verified \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            "release/openssl-${OPENSSL_VERSION}.tar.gz" \
            "${OPENSSL_SOURCE_SHA256}"
          cd release
          sha256sum raffi-ffmpeg-* ffmpeg-* openssl-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source versions.env
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --title "FFmpeg ${FFMPEG_VERSION} for Raffi" \
            --notes "Reproducible LGPLv3 FFmpeg ${FFMPEG_VERSION} build revision ${BUILD_REVISION}. Verify downloads with SHA256SUMS and GitHub artifact attestations."
